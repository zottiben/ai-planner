# Installers for the three platforms.
#
# Each one is built on its own runner because a Tauri bundle is not cross-compilable in
# any useful sense: it links the platform's own webview (WebKit, WebView2, WebKitGTK).
# That is the cost D3 accepted in exchange for an app measured in tens of megabytes
# rather than hundreds.
#
# Nothing here is signed. See the note at the end of the README's desktop section - an
# unsigned .dmg gets a Gatekeeper warning and an unsigned installer gets SmartScreen.
# Both are documented rather than discovered by whoever downloads one.

name: desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: macos-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # WebKitGTK and its build dependencies. 22.04 rather than latest because the
      # glibc an AppImage is built against is the oldest it will run on.
      - name: System dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libxdo-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Built explicitly rather than left to build.rs, so a frontend failure fails here
      # with npm's own message instead of silently embedding the committed bundle.
      - name: Build the frontend
        run: npm ci && npm run build
        working-directory: ui

      - name: Bundle
        run: npx @tauri-apps/cli@2 build --target ${{ matrix.target }}
        working-directory: crates/ai-planner-desktop

      - uses: actions/upload-artifact@v4
        with:
          name: ai-planner-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/deb/*.deb
