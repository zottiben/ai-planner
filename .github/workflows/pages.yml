name: Pages

# Publishes the install scripts at a stable, curl-friendly URL:
#   curl -fsSL https://zottiben.github.io/ai-planner/install.sh | sh
on:
  push:
    branches: [main]
    paths:
      - "install/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp install/install.sh install/install-mcp.sh \
            install/install-hook.sh install/install-skill.sh _site/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>ai-planner</title>
          <style>
            body { max-width: 42rem; margin: 12vh auto; padding: 0 1.5rem;
                   font: 17px/1.55 system-ui; color: #202124; }
            code { background: #f1f3f4; padding: .2rem .4rem; border-radius: .3rem; }
            a { color: #275bd6; }
          </style>
          <h1>ai-planner</h1>
          <p>Build plans as rows in one SQLite database, with a CLI, agent tools and a Kanban board.</p>
          <p><code>curl -fsSL https://zottiben.github.io/ai-planner/install.sh | sh</code></p>
          <p><a href="https://github.com/zottiben/ai-planner">Source and documentation</a></p>
          HTML
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
