[toolchain]
# Pinned so every machine and CI build with the identical compiler. Bump
# deliberately, via a commit; keep it in sync with the CI and release matrices.
#
# 1.88 is the floor, not a preference: `slice::as_chunks` in `embed.rs` stabilised
# there. Dropping below it stops the build rather than degrading it.
channel = "1.98.1"
components = ["rustfmt", "clippy"]
