[workspace]
resolver = "2"
members = [
    "crates/ai-planner-core",
    "crates/ai-planner-ui",
    "crates/ai-planner",
    "crates/ai-planner-desktop",
]

# The desktop shell is out of the default set on purpose. It pulls in Tauri and a
# platform webview, which is minutes of build time and a system dependency on Linux -
# and nobody changing `store.rs` should pay for either. `cargo build`, `cargo test` and
# `cargo clippy` at the root skip it; build it by name with `-p ai-planner-desktop`.
default-members = [
    "crates/ai-planner-core",
    "crates/ai-planner-ui",
    "crates/ai-planner",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/zottiben/ai-planner"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.37", features = ["bundled"] }
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
getrandom = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "signal"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
