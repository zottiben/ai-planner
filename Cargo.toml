[workspace]
resolver = "2"
members = ["crates/ai-planner-core", "crates/ai-planner"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/zottiben/ai-planner"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "signal"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
